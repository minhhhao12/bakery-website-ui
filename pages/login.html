<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Sweet Bakery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Đăng nhập</h1>
          <p class="auth-desc">
            Chào mừng bạn trở lại với <span>Sweet Bakery</span>
          </p>
        </div>

        <form class="auth-form" action="../index.html" method="get">
          <div class="form-group">
            <label for="email" class="form-label">Email của bạn</label>
            <input
              type=""
              id="email"
              class="input"
              placeholder="Nhập email của bạn"
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Mật khẩu</label>
            <input
              type="password"
              id="password"
              class="input"
              placeholder="••••••••"
              required
            />
          </div>

          <div class="auth-options">
            <label class="checkbox-label">
              <input type="checkbox" class="checkbox-input" />
              <span>Ghi nhớ tôi</span>
            </label>
            <a href="#" class="link">Quên mật khẩu?</a>
          </div>

          <a
            type="submit"
            id="btn-login"
            class="btn btn-primary btn-lg auth-btn"
            >Đăng nhập</a
          >
        </form>

        <div class="auth-footer">
          Chưa có tài khoản? <a href="signin.html" class="link">Đăng ký ngay</a>
        </div>

        <a href="/index.html" class="back-home-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          Quay lại trang chủ
        </a>
      </div>
    </section>
    <details class="contact-float" aria-label="Liên hệ nhanh">
      <summary
        class="contact-float__toggle"
        aria-label="Mở hoặc đóng liên hệ nhanh"
      >
        <span
          class="contact-float__icon contact-float__toggle-icon"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </span>
      </summary>
      <div class="contact-float__items">
        <div class="contact-float__item contact-float__item--order">
          <span class="contact-float__icon" aria-hidden="true"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 7h12l1 14H5L6 7Z" />
              <path d="M9 7a3 3 0 0 1 6 0" />
              <path d="M9 12h6" /></svg
          ></span>
          <span class="contact-float__copy"
            ><strong>Đặt bánh ngay</strong
            ><small>Chọn bánh yêu thích</small></span
          >
        </div>
        <div class="contact-float__item">
          <span class="contact-float__icon" aria-hidden="true"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"
              /></svg
          ></span>
          <span class="contact-float__copy"
            ><strong>Gọi hotline</strong><small>090 123 4567</small></span
          >
        </div>
        <div class="contact-float__item">
          <span
            class="contact-float__icon contact-float__icon--zalo"
            aria-hidden="true"
            >Z</span
          >
          <span class="contact-float__copy"
            ><strong>Tư vấn qua Zalo</strong
            ><small>Chat với Sweet Bakery</small></span
          >
        </div>
        <div class="contact-float__item">
          <span class="contact-float__icon" aria-hidden="true"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" /></svg
          ></span>
          <span class="contact-float__copy"
            ><strong>Gửi email</strong
            ><small>sweetbakeryofficial@sweetbakery.vn</small></span
          >
        </div>
      </div>
    </details>
    <script src="../Javascript/login.js"></script>
  </body>
</html>
